
# Common variables for all Airflow services 
x-airflow-common:
  &airflow-common
  build: .                          # use our Dockerfile
  environment:
    &airflow-common-env
    # Execute and DB of Aiflow metadata
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow123@postgres-airflow/airflow
    AIRFLOW__CORE__FERNET_KEY: ''
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__WEBSERVER__SECRET_KEY: food-platform-secret-key-2024

    # Conection to our DB
    FOOD_DB_CONN: postgresql+psycopg2://food_user:food_password123@postgres-food/food_platform

    # Project variables
    POSTGRES_HOST: postgres-food
    POSTGRES_PORT: 5432
    POSTGRES_DB: food_platform
    POSTGRES_USER: food_user
    POSTGRES_PASSWORD: food_password123

  volumes:
    - ./airflow/dags:/opt/airflow/dags         # our DAGs
    - ./airflow/logs:/opt/airflow/logs         # logs of execution
    - ./airflow/plugins:/opt/airflow/plugins   # plugins custom
    - ./data:/opt/airflow/data                 # data raw (CSV)
    - ./dbt:/opt/airflow/dbt                   # dbt volume
  depends_on:
    postgres-airflow:
      condition: service_healthy

# SERVICES
services:

  # PostgreSQL — internal Airflow metadata 
  postgres-airflow:
    image: postgres:15
    container_name: postgres_airflow
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow123
      POSTGRES_DB: airflow
    volumes:
      - postgres_airflow_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always

  # PostgreSQL — DB of the project (raw, staging, marts)
  postgres-food:
    image: postgres:15
    container_name: postgres_food
    environment:
      POSTGRES_USER: food_user
      POSTGRES_PASSWORD: food_password123
      POSTGRES_DB: food_platform
    volumes:
      - postgres_food_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d   # scripts of the init (create a table in postgres)
    ports:
      - "5432:5432"    # exposure to be connected from DBeaver/pgAdmin
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "food_user", "-d", "food_platform"]
      interval: 10s
      retries: 5
      start_period: 5s
    restart: always

  # Airflow — initialization (executed only one time)
  airflow-init:
    <<: *airflow-common
    container_name: airflow_init
    command: bash -c "airflow db migrate && airflow users create --username admin --password admin123 --firstname Admin --lastname User --role Admin --email admin@foodplatform.com"
    environment:
      <<: *airflow-common-env
    restart: on-failure

  # Airflow — webserver (UI in localhost:8080)
  airflow-webserver:
    <<: *airflow-common
    container_name: airflow_webserver
    command: webserver
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  # Airflow — scheduler (execute DAGs)
  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow_scheduler
    command: scheduler
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  streamlit:
    image: python:3.9.13
    container_name: streamlit_app
    working_dir: /app
    volumes:
      - ./streamlit:/app
    ports:
      - "8501:8501"
    depends_on:
      postgres-food:
        condition: service_healthy
    restart: always
    command: >
      bash -c "pip install streamlit psycopg2-binary sqlalchemy -q &&
               streamlit run app.py --server.port=8501 --server.address=0.0.0.0"
    environment:
      POSTGRES_HOST: postgres-food
      POSTGRES_PORT: 5432
      POSTGRES_DB: food_platform
      POSTGRES_USER: food_user
      POSTGRES_PASSWORD: food_password123

# VOLUMNS — persistence of data
volumes:
  postgres_airflow_data:
  postgres_food_data: