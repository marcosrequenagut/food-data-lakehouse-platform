version: 2

sources:
  - name: raw
    description: "Raw data loaded by Airflow from Open Food Facts API"
    schema: raw
    tables:
      - name: products
        description: "Raw products table with 669 products from Open Food Facts"
        loaded_at_field: ingested_at
        freshness:
          warn_after: {count: 24, period: hour}
          error_after: {count: 48, period: hour}
        columns:
          - name: code
            description: "Product barcode - primary key"
            tests:
              - not_null
              - unique
          - name: product_name
            description: "Product name"
            tests:
              - not_null